apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-agri-deployment
  labels:
    app: smart-agri
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: smart-agri
  template:
    metadata:
      labels:
        app: smart-agri
    spec:
      containers:
      - name: smart-agri-container
        image: syedsaifullah/smart-agri-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: smart-agri-service
spec:
  type: NodePort
  selector:
    app: smart-agri
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080